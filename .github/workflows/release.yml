# Release `devsess` to npm via Changesets + OIDC trusted publishing.
#
# Authentication is OIDC — there is NO NPM_TOKEN / NODE_AUTH_TOKEN secret.
# Requirements:
#   1. `permissions.id-token: write` (granted below) for the OIDC token.
#   2. `actions/setup-node` with the npm registry URL.
#   3. npm >= 11.5.1 on the runner (we install npm@latest before publish).
#   4. The package sets `publishConfig.provenance: true` + `access: public`.
#
# First-publish bootstrap: OIDC trusted publishing can only be configured on
# npmjs.com AFTER the package exists. Do the very first publish manually once:
#   cd packages/devsess && npm publish --access public
# then configure the trusted publisher (this repo + this workflow) on npmjs.com.
#
# Normal flow: `pnpm changeset` to record a bump, merge to main. Changesets opens
# a "Version Packages" PR; merging it runs this workflow and publishes.

name: release

on:
  push:
    branches: [main]
    paths: ['.changeset/**']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          cache: false
          install: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm install -g npm@latest
        working-directory: ${{ runner.temp }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter devsess build
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run ci:version
          publish: pnpm run ci:release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NO NODE_AUTH_TOKEN / NPM_TOKEN — auth is via OIDC, not a secret.
