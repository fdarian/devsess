# Release `devsess` to npm and `@devsess/cli` as binaries via Changesets.
#
# `devsess` (the library) publishes to npm with OIDC trusted publishing — there
# is NO NPM_TOKEN / NODE_AUTH_TOKEN secret. Requirements:
#   1. `permissions.id-token: write` (granted below) for the OIDC token.
#   2. `actions/setup-node` with the npm registry URL.
#   3. npm >= 11.5.1 on the runner: Node 26's bundled npm 11. Don't install
#      npm@latest: npm 12 changed `npm info --json` to return an array, so
#      `changeset publish` thinks every version is unpublished and tries to
#      republish.
#   4. The package sets `publishConfig.provenance: true` + `access: public`.
#
# First-publish bootstrap (once, for `devsess`): OIDC trusted publishing can
# only be configured on npmjs.com AFTER the package exists. Do the very first
# publish manually from `packages/devsess`:
#   npm publish --access public
# then configure the trusted publisher (this repo + this workflow) on npmjs.com.
#
# `@devsess/cli` is private: `changeset publish` skips npm but still tags it
# (`@devsess/cli@<version>`). The CLI part is idempotent and driven by state,
# not by changesets' output: `cli-release-check` publishes the version in
# packages/cli/package.json whenever its tag exists on origin and the formula
# in fdarian/homebrew-tap is older. The `binaries` job then builds a Node SEA
# per platform on native runners (the SEA bundles the host's node-pty prebuild,
# so it cannot be cross-compiled) from that tag, and the `homebrew` job uploads
# the tarballs to the GitHub Release and updates the formula. A failed run is
# retried with workflow_dispatch (Actions tab > release > Run workflow). That
# needs the `HOMEBREW_TAP_TOKEN` repository secret: a PAT with contents:write
# on fdarian/homebrew-tap.
#
# Normal flow: `pnpm changeset` to record a bump, merge to main. Changesets opens
# a "Version Packages" PR; merging it runs this workflow and releases.

name: release

on:
  push:
    branches: [main]
    paths: ['.changeset/**', '.github/workflows/release.yml']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          cache: false
          install: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter devsess build
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run ci:version
          publish: pnpm run ci:release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NO NODE_AUTH_TOKEN / NPM_TOKEN — auth is via OIDC, not a secret.

  cli-release-check:
    needs: release
    # `!cancelled()` drops the implicit success() so the CLI release still runs
    # when the library publish failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version packages/cli/package.json)
          TAG="@devsess/cli@${VERSION}"

          STATUS=0
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null || STATUS=$?
          if [ "$STATUS" -eq 2 ]; then
            echo "Tag ${TAG} does not exist on origin; changesets has not tagged it yet. No CLI release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$STATUS" -ne 0 ]; then
            echo "git ls-remote failed with status ${STATUS}" >&2
            exit "$STATUS"
          fi

          ERR=$(mktemp)
          if CONTENT=$(gh api repos/fdarian/homebrew-tap/contents/Formula/devsess.rb --jq .content 2>"$ERR"); then
            PUBLISHED=$(echo "$CONTENT" | base64 -d | sed -nE 's/^[[:space:]]*version "([^"]+)".*/\1/p' | head -n 1)
            if [ -z "$PUBLISHED" ]; then
              echo "Could not find a version line in the tap formula" >&2
              exit 1
            fi
          elif grep -q 'HTTP 404' "$ERR"; then
            PUBLISHED=""
          else
            cat "$ERR" >&2
            exit 1
          fi

          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "Tap formula is already at ${VERSION}. No CLI release."
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} exists and the tap formula is at '${PUBLISHED:-<absent>}'. Releasing ${VERSION}."
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    needs: cli-release-check
    # A failed `release` (library publish) is an ancestor; without a status function this job would be skipped.
    if: ${{ !cancelled() && needs.cli-release-check.result == 'success' && needs.cli-release-check.outputs.version != '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: darwin-arm64
            runner: macos-latest
          - label: darwin-x64
            runner: macos-15-intel
          - label: linux-x64
            runner: ubuntu-latest
          - label: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/@devsess/cli@${{ needs.cli-release-check.outputs.version }}

      - uses: pnpm/setup@v2
        with:
          cache: false
          install: false
      # tsdown builds the SEA with `node --build-sea`, which needs a recent Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:exe
      - run: |
          mkdir -p packages/cli/build/releases
          tar -czf packages/cli/build/releases/devsess-${{ matrix.label }}.tar.gz -C packages/cli/build devsess
      - run: packages/cli/build/devsess --version
      - uses: actions/upload-artifact@v7
        with:
          name: devsess-${{ matrix.label }}
          path: packages/cli/build/releases/devsess-${{ matrix.label }}.tar.gz
          if-no-files-found: error

  homebrew:
    needs: [cli-release-check, binaries]
    if: ${{ !cancelled() && needs.binaries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: devsess-*
          merge-multiple: true
          path: packages/cli/build/releases

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.cli-release-check.outputs.version }}
        run: |
          TAG="@devsess/cli@${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Release $VERSION"
          gh release upload "$TAG" packages/cli/build/releases/*.tar.gz --clobber

      - uses: oven-sh/setup-bun@v2
      - name: Update Homebrew formula
        working-directory: packages/cli
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.cli-release-check.outputs.version }}
        run: bun run scripts/update-homebrew.ts
